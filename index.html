<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes · Transporte Público</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#111110;
  --ink-2:#52524e;
  --ink-3:#a8a29e;
  --line:#e7e5e0;
  --line-2:#d6d3cc;
  --fill:#f6f5f2;
  --white:#ffffff;
  --accent:#1a56db;
  --accent-bg:#eff6ff;
  --accent-line:#bfdbfe;
  --ok:#16a34a;
  --ok-bg:#f0fdf4;
  --ok-line:#bbf7d0;
  --warn:#b45309;
  --warn-bg:#fffbeb;
  --r:10px;
  --r-sm:6px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
}

body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--fill);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  -webkit-font-smoothing:antialiased;
}

/* ── LOGIN ── */
#login-screen{width:100%;max-width:400px}

.login-card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:16px;
  padding:36px 32px;
  box-shadow:var(--shadow-md);
}

.brand-mark{
  display:flex;align-items:center;gap:10px;margin-bottom:28px;
}
.brand-icon{
  width:36px;height:36px;
  background:var(--accent);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.brand-icon svg{color:#fff}
.brand-name{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.brand-sub{font-size:12px;color:var(--ink-3);margin-top:1px}

h2{font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.02em;margin-bottom:4px}
.login-desc{font-size:13px;color:var(--ink-2);margin-bottom:24px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:6px;letter-spacing:.01em}
.field input{
  width:100%;height:38px;padding:0 12px;
  background:var(--white);
  border:1px solid var(--line-2);
  border-radius:var(--r-sm);
  color:var(--ink);font-size:14px;
  outline:none;transition:border-color .15s,box-shadow .15s;
  font-family:inherit;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.field input::placeholder{color:var(--ink-3)}

.btn{
  width:100%;height:38px;
  background:var(--accent);border:none;
  border-radius:var(--r-sm);
  color:#fff;font-size:14px;font-weight:500;
  cursor:pointer;transition:background .15s,transform .1s;
  font-family:inherit;margin-top:6px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{background:#1d4ed8}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.login-msg{margin-top:12px;text-align:center;font-size:13px;min-height:20px}
.msg-ok{color:var(--ok)}
.msg-err{color:#dc2626}

.divider{height:1px;background:var(--line);margin:24px 0}

/* ── CHAT ── */
#chat-screen{
  display:none;
  width:100%;max-width:640px;
  height:90vh;
}

.chat-card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:16px;
  height:100%;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-md);
  overflow:hidden;
}

.chat-header{
  padding:14px 18px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
  background:var(--white);
  flex-shrink:0;
}
.header-icon{
  width:34px;height:34px;
  background:var(--accent-bg);
  border:1px solid var(--accent-line);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.header-icon svg{color:var(--accent)}
.header-info h3{font-size:14px;font-weight:600;color:var(--ink)}
.header-info p{font-size:12px;color:var(--ink-3);margin-top:1px}
.status-dot{
  width:8px;height:8px;
  background:var(--ok);border-radius:50%;
  margin-left:auto;flex-shrink:0;
}

/* Messages */
.messages{
  flex:1;padding:20px 16px;
  overflow-y:auto;
  display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-track{background:transparent}
.messages::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px}

.msg-row{display:flex;flex-direction:column;gap:3px;max-width:82%}
.msg-row.bot{align-items:flex-start}
.msg-row.user{align-items:flex-end;align-self:flex-end}

.bubble{
  padding:10px 14px;
  border-radius:12px;
  font-size:14px;line-height:1.55;
}
.bot .bubble{
  background:var(--fill);
  border:1px solid var(--line);
  border-bottom-left-radius:3px;
  color:var(--ink);
}
.user .bubble{
  background:var(--accent);
  border-bottom-right-radius:3px;
  color:#fff;
}

.msg-time{font-size:11px;color:var(--ink-3);padding:0 2px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{
  padding:7px 14px;
  background:var(--white);
  border:1px solid var(--line-2);
  border-radius:20px;
  color:var(--ink);
  font-size:13px;font-weight:500;
  cursor:pointer;transition:border-color .15s,background .15s,color .15s;
  font-family:inherit;
}
.chip:hover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.chip:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}

/* Summary */
.summary{
  background:var(--fill);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
  margin-top:8px;
}
.summary-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:10px}
.s-row{display:flex;gap:8px;margin-bottom:7px;font-size:13px}
.s-row:last-child{margin-bottom:0}
.s-key{color:var(--ink-3);min-width:90px;flex-shrink:0}
.s-val{color:var(--ink);font-weight:500}

/* Success */
.success-box{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--ok-bg);border:1px solid var(--ok-line);
  border-radius:10px;padding:12px 14px;margin-top:8px;
}
.ok-icon{color:var(--ok);flex-shrink:0;margin-top:1px}
.ok-text{font-size:13px;color:var(--ink);line-height:1.55}
.ok-id{font-size:12px;color:var(--ink-3);margin-top:4px}

/* Typing */
.typing{display:flex;gap:5px;align-items:center;padding:3px 0}
.typing span{
  width:6px;height:6px;background:var(--ink-3);border-radius:50%;
  animation:dot 1.2s infinite ease-in-out;
}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,80%,100%{transform:scale(.65);opacity:.4}40%{transform:scale(1);opacity:1}}

/* Input bar */
.chat-bar{
  padding:12px 14px;
  border-top:1px solid var(--line);
  background:var(--white);
  display:flex;gap:8px;align-items:center;
  flex-shrink:0;
}
#chat-input{
  flex:1;height:38px;padding:0 14px;
  background:var(--fill);
  border:1px solid var(--line);
  border-radius:20px;
  color:var(--ink);font-size:14px;
  outline:none;transition:border-color .15s;
  font-family:inherit;
}
#chat-input:focus{border-color:var(--accent)}
#chat-input::placeholder{color:var(--ink-3)}
#chat-input:disabled{opacity:.5;cursor:not-allowed}

.send{
  width:38px;height:38px;flex-shrink:0;
  background:var(--accent);border:none;border-radius:50%;
  color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .1s;
}
.send:hover{background:#1d4ed8}
.send:active{transform:scale(.95)}
.send:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* Fade in */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .25s ease forwards}

/* Error inline */
.inline-err{
  display:flex;gap:6px;align-items:flex-start;
  background:var(--warn-bg);
  border:1px solid #fcd34d;
  border-radius:8px;
  padding:9px 12px;
  font-size:13px;color:var(--warn);
  margin-top:6px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="brand-mark">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="1" y="3" width="15" height="13" rx="2"/>
          <path d="M16 8h4l3 5v3h-7V8z"/>
          <circle cx="5.5" cy="18.5" r="2.5"/>
          <circle cx="18.5" cy="18.5" r="2.5"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">TransReport</div>
        <div class="brand-sub">Sistema de reportes</div>
      </div>
    </div>

    <h2>Ingresa al sistema</h2>
    <p class="login-desc">Acceso exclusivo para operadores autorizados.</p>

    <div class="field">
      <label>Correo electrónico</label>
      <input type="email" id="email" placeholder="operador@transporte.mx" autocomplete="email">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="login-btn">Ingresar</button>
    <div class="login-msg" id="login-status"></div>
  </div>
</div>

<!-- CHAT -->
<div id="chat-screen">
  <div class="chat-card">
    <div class="chat-header">
      <div class="header-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="1" y="3" width="15" height="13" rx="2"/>
          <path d="M16 8h4l3 5v3h-7V8z"/>
          <circle cx="5.5" cy="18.5" r="2.5"/>
          <circle cx="18.5" cy="18.5" r="2.5"/>
        </svg>
      </div>
      <div class="header-info">
        <h3>Asistente de reportes</h3>
        <p>Transporte Público · En línea</p>
      </div>
      <div class="status-dot"></div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="chat-bar">
      <input type="text" id="chat-input" placeholder="Escribe tu respuesta…" autocomplete="off">
      <button class="send" id="send-btn" aria-label="Enviar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig={
  apiKey: "AIzaSyDXmwC5577FJ4nO7wR4d0QS5aZaiwb6Mw8",
  authDomain: "pruebas-80a12.firebaseapp.com",
  projectId: "pruebas-80a12",
  storageBucket: "pruebas-80a12.firebasestorage.app",
  messagingSenderId: "337416174160",
  appId: "1:337416174160:web:ea5ce168854d880b59af55",
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

// ── Unidades predefinidas ──
const UNIDADES=[
  {label:"Ruta 1 · Unidad 101",value:"R1-101"},
  {label:"Ruta 1 · Unidad 102",value:"R1-102"},
  {label:"Ruta 2 · Unidad 201",value:"R2-201"},
  {label:"Ruta 2 · Unidad 202",value:"R2-202"},
  {label:"Ruta 3 · Unidad 301",value:"R3-301"},
  {label:"Ruta 3 · Unidad 302",value:"R3-302"},
  {label:"Ruta 4 · Unidad 401",value:"R4-401"},
  {label:"Ruta 5 · Unidad 501",value:"R5-501"},
  {label:"Ruta 6 · Unidad 601",value:"R6-601"},
  {label:"Ruta 7 · Unidad 701",value:"R7-701"},
];

const TIPOS=[
  {label:"Accidente de tránsito"},
  {label:"Conducta inapropiada del conductor"},
  {label:"Falla mecánica de la unidad"},
  {label:"Sobrecupo o puertas inseguras"},
  {label:"Cobro incorrecto de tarifa"},
  {label:"Otro tipo de incidente"},
];

const S={MENU:"MENU",TIPO:"TIPO",DESCRIPCION:"DESCRIPCION",HORA:"HORA",UNIDAD:"UNIDAD",CONFIRMAR:"CONFIRMAR",DONE:"DONE"};

let estado=S.MENU;
let userName="";
let reporte={tipo:"",descripcion:"",hora:"",unidad:""};
let busy=false;

const loginScreen=document.getElementById("login-screen");
const chatScreen=document.getElementById("chat-screen");
const loginBtn=document.getElementById("login-btn");
const loginStatus=document.getElementById("login-status");
const msgsEl=document.getElementById("messages");
const chatInput=document.getElementById("chat-input");
const sendBtn=document.getElementById("send-btn");

// ── Login ──
loginBtn.addEventListener("click",async()=>{
  const email=document.getElementById("email").value.trim();
  const pass=document.getElementById("password").value;
  if(!email||!pass)return;
  loginBtn.disabled=true;
  loginStatus.textContent="Verificando…";
  loginStatus.className="login-msg";
  try{
    const cred=await signInWithEmailAndPassword(auth,email,pass);
    userName=cred.user.email.split("@")[0];
    loginStatus.textContent="Acceso concedido";
    loginStatus.className="login-msg msg-ok";
    setTimeout(()=>{
      loginScreen.style.display="none";
      chatScreen.style.display="block";
      startChat();
    },800);
  }catch(e){
    loginStatus.className="login-msg msg-err";
    loginStatus.textContent=e.code==="auth/invalid-credential"?"Correo o contraseña incorrectos.":"Error: "+e.code;
    loginBtn.disabled=false;
  }
});

// ── UI helpers ──
function ts(){return new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})}

function addBubble(who,html){
  const w=document.createElement("div");
  w.className=`msg-row ${who} fade`;
  w.innerHTML=`<div class="bubble">${html}</div><span class="msg-time">${ts()}</span>`;
  msgsEl.appendChild(w);
  msgsEl.scrollTop=msgsEl.scrollHeight;
}

function addChips(items){
  const g=document.createElement("div");
  g.className="chips fade";
  items.forEach(({label,value})=>{
    const b=document.createElement("button");
    b.className="chip";
    b.textContent=label;
    b.addEventListener("click",()=>{
      g.querySelectorAll("button").forEach(x=>x.disabled=true);
      addBubble("user",label);
      handle(value||label);
    });
    g.appendChild(b);
  });
  msgsEl.appendChild(g);
  msgsEl.scrollTop=msgsEl.scrollHeight;
}

function typing(ms=800){
  const w=document.createElement("div");
  w.className="msg-row bot fade";
  w.innerHTML=`<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  msgsEl.appendChild(w);
  msgsEl.scrollTop=msgsEl.scrollHeight;
  return new Promise(r=>setTimeout(()=>{w.remove();r()},ms));
}

function lock(on){
  chatInput.disabled=!on;
  sendBtn.disabled=!on;
  busy=!on;
}

// ── Claude content moderation ──
async function isSafe(text){
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{role:"user",content:`Analiza si el siguiente texto para un reporte de transporte público es apropiado y coherente (sin groserías, sin contenido ofensivo, sin texto sin sentido). Responde ÚNICAMENTE con "OK" si es apropiado, o "NO: [razón breve]" si no lo es.\n\nTexto: "${text}"`}]
      })
    });
    const d=await r.json();
    const ans=d.content[0].text.trim();
    return {ok:ans.startsWith("OK"),reason:ans.replace(/^NO:\s*/,"")};
  }catch{return{ok:true,reason:""}}
}

// ── Validar hora HH:MM ──
function validarHora(txt){
  return /^([01]?\d|2[0-3]):([0-5]\d)$/.test(txt.trim());
}

// ── Chat flow ──
async function startChat(){
  lock(false);
  await typing(600);
  addBubble("bot",`Hola, <strong>${userName}</strong>. Bienvenido al sistema de reportes.<br>¿Qué deseas hacer?`);
  addChips([{label:"Registrar un reporte",value:"REPORTE"},{label:"¿Cómo funciona?",value:"AYUDA"}]);
  estado=S.MENU;
  lock(true);
}

async function handle(txt){
  lock(false);

  if(estado===S.MENU){
    if(txt==="REPORTE"){
      await typing(500);
      addBubble("bot","Perfecto, iniciemos el reporte.<br>¿Qué <strong>tipo de incidente</strong> ocurrió?");
      addChips(TIPOS);
      estado=S.TIPO;
    } else if(txt==="AYUDA"){
      await typing(500);
      addBubble("bot","Este sistema permite registrar incidentes en unidades de transporte público. Los reportes se guardan en tiempo real en la base de datos.<br><br>¿Deseas registrar un reporte ahora?");
      addChips([{label:"Registrar un reporte",value:"REPORTE"},{label:"No por ahora",value:"NO"}]);
    } else if(txt==="NO"||txt.toLowerCase().includes("no")){
      await typing(400);
      addBubble("bot","Entendido. Escribe <em>«hola»</em> cuando necesites algo.");
      lock(true);
    } else {
      await typing(400);
      addBubble("bot","Escribe <em>«hola»</em> o selecciona una opción para comenzar.");
      lock(true);
    }

  } else if(estado===S.TIPO){
    if(txt==="Otro tipo de incidente"){
      await typing(350);
      addBubble("bot","Describe brevemente el tipo de incidente:");
      estado=S.TIPO;
      lock(true);
    } else {
      reporte.tipo=txt;
      await typing(500);
      addBubble("bot",`Tipo registrado: <strong>${txt}</strong><br><br>Describe qué pasó exactamente. Sé claro y objetivo.`);
      estado=S.DESCRIPCION;
      lock(true);
    }

  } else if(estado===S.DESCRIPCION){
    if(txt.length<10){
      await typing(300);
      addBubble("bot","Por favor proporciona una descripción más detallada del incidente.");
      lock(true);return;
    }
    const check=await isSafe(txt);
    if(!check.ok){
      await typing(300);
      addBubble("bot",`La descripción no es válida: <em>${check.reason}</em><br>Por favor redáctala de forma clara y respetuosa.`);
      lock(true);return;
    }
    reporte.descripcion=txt;
    await typing(500);
    addBubble("bot","Descripción registrada.<br><br>¿A qué hora ocurrió? Escribe en formato <strong>HH:MM</strong> (por ejemplo: <code>14:30</code>).");
    estado=S.HORA;
    chatInput.placeholder="Ejemplo: 14:30";
    lock(true);

  } else if(estado===S.HORA){
    if(!validarHora(txt)){
      await typing(300);
      addBubble("bot","Ingresa la hora en formato <strong>HH:MM</strong>, por ejemplo <code>09:15</code> o <code>14:30</code>.");
      lock(true);return;
    }
    reporte.hora=txt.trim();
    await typing(500);
    addBubble("bot",`Hora registrada: <strong>${reporte.hora}</strong><br><br>Selecciona la <strong>unidad</strong> donde ocurrió el incidente:`);
    chatInput.placeholder="Escribe tu respuesta…";
    addChips(UNIDADES);
    estado=S.UNIDAD;

  } else if(estado===S.UNIDAD){
    reporte.unidad=txt;
    await typing(600);
    addBubble("bot",`Revisa el resumen antes de enviar:
      <div class="summary" style="margin-top:10px">
        <div class="summary-label">Resumen del reporte</div>
        <div class="s-row"><span class="s-key">Tipo</span><span class="s-val">${reporte.tipo}</span></div>
        <div class="s-row"><span class="s-key">Descripción</span><span class="s-val">${reporte.descripcion}</span></div>
        <div class="s-row"><span class="s-key">Hora</span><span class="s-val">${reporte.hora}</span></div>
        <div class="s-row"><span class="s-key">Unidad</span><span class="s-val">${reporte.unidad}</span></div>
      </div>`);
    addChips([{label:"Confirmar y enviar",value:"CONFIRMAR"},{label:"Cancelar",value:"CANCELAR"}]);
    estado=S.CONFIRMAR;

  } else if(estado===S.CONFIRMAR){
    if(txt==="CONFIRMAR"){
      await typing(700);
      addBubble("bot","Guardando reporte…");
      try{
        const ref=await addDoc(collection(db,"reportes_transporte"),{
          tipo:reporte.tipo,descripcion:reporte.descripcion,
          hora:reporte.hora,unidad:reporte.unidad,
          operador:userName,fechaEnvio:serverTimestamp()
        });
        addBubble("bot",`<div class="success-box">
          <svg class="ok-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
          <div><p class="ok-text">Reporte enviado correctamente.</p><p class="ok-id">ID: <strong>${ref.id}</strong></p></div>
        </div><br>¿Deseas registrar otro reporte?`);
        reporte={tipo:"",descripcion:"",hora:"",unidad:""};
        addChips([{label:"Registrar otro reporte",value:"REPORTE"},{label:"No, eso es todo",value:"FIN"}]);
        estado=S.DONE;
      }catch(e){
        addBubble("bot",`Ocurrió un error al guardar: <em>${e.message}</em><br>¿Deseas intentarlo de nuevo?`);
        addChips([{label:"Reintentar",value:"CONFIRMAR"},{label:"Cancelar",value:"CANCELAR"}]);
        estado=S.CONFIRMAR;
      }
    } else {
      reporte={tipo:"",descripcion:"",hora:"",unidad:""};
      await typing(350);
      addBubble("bot","Reporte cancelado. ¿Qué deseas hacer?");
      addChips([{label:"Registrar un reporte",value:"REPORTE"},{label:"Nada por ahora",value:"NO"}]);
      estado=S.MENU;
    }

  } else if(estado===S.DONE){
    if(txt==="REPORTE"||txt==="Registrar otro reporte"){
      reporte={tipo:"",descripcion:"",hora:"",unidad:""};
      await typing(400);
      addBubble("bot","¿Qué tipo de incidente ocurrió?");
      addChips(TIPOS);
      estado=S.TIPO;
    } else {
      await typing(350);
      addBubble("bot","Hasta luego. Escribe <em>«hola»</em> si necesitas hacer otro reporte.");
      lock(true);
      estado=S.MENU;
    }
  }

  if([S.DESCRIPCION,S.HORA].includes(estado))lock(true);
  else if(estado===S.MENU||estado===S.DONE)lock(true);
}

// ── Envío por teclado ──
function send(){
  if(busy)return;
  const txt=chatInput.value.trim();
  if(!txt)return;
  chatInput.value="";
  if(estado===S.MENU&&(txt.toLowerCase().includes("hola")||txt.toLowerCase().includes("inicio"))){
    addBubble("user",txt);handle("REPORTE");return;
  }
  addBubble("user",txt);
  handle(txt);
}

sendBtn.addEventListener("click",send);
chatInput.addEventListener("keypress",e=>{if(e.key==="Enter")send()});
</script>
